version: '3.8'

services:
  backend:
    build: .
    container_name: scam_honeypot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    # Override command to enable hot-reloading for development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
